<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पंचायत कार्य डैशबोर्ड (JSON से लोड)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f6f9; }
        h1 { text-align: center; color: #333; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow-x: auto; }
        .controls { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .controls input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; width: 250px; font-size: 14px; }
        .stats { font-size: 14px; color: #666; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; word-break: break-word; }
        th { background-color: #f8f9fa; font-weight: 600; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background-color: #fcfcfc; }
        tr:hover { background-color: #f1f1f1; }
        .error-msg { color: red; text-align: center; padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>पंचायत कार्य डैशबोर्ड (JSON फाइल्स से)</h1>

    <div class="container">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="खोजें (Work Name, Code, Panchayat...)">
            <div class="stats" id="stats">कुल कार्य: लोड हो रहा है...</div>
        </div>

        <div id="loading" style="text-align:center; padding:20px;">⏳ डेटा लोड हो रहा है, कृपया प्रतीक्षा करें...</div>
        <div id="error" class="error-msg" style="display:none;"></div>

        <table id="dashboardTable">
            <thead>
                <tr>
                    <th>SNo.</th>
                    <th>Panchayat</th>
                    <th>Work Type</th>
                    <th>Work Code</th>
                    <th>Work Name</th>
                    <th>Wages</th>
                    <th>Material</th>
                    <th>Sanction</th>
                    <th>Wages_Exp</th>
                    <th>Material_exp</th>
                    <th>Total</th>
                    <th>Manday</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be injected here -->
            </tbody>
        </table>
    </div>

    <script>
        // ---------------- DATA FETCH AND PROCESSING ----------------
        async function loadAndProcessData() {
            try {
                // 1. JSON फाइल्स को fetch करें
                const [panchayatRes, workRes] = await Promise.all([
                    fetch('data.json'),
                    fetch('work.json')
                ]);

                if (!panchayatRes.ok || !workRes.ok) {
                    throw new Error(`फाइल नहीं मिली। data.json (${panchayatRes.status}) या work.json (${workRes.status}) चेक करें।`);
                }

                const rawPanchayat = await panchayatRes.json();
                const rawWork = await workRes.json();

                // 2. Panchayat Master Data (data.json) पार्स करें
                const pHeaders = rawPanchayat[1];
                const pData = rawPanchayat.slice(2);
                
                let panchayatMap = {};
                pData.forEach(row => {
                    // इंडेक्स: Panchayats=1, BLOCK=7
                    let panchayatName = String(row[1] || '').trim();
                    let blockName = String(row[7] || '').trim();
                    
                    if (panchayatName && blockName) {
                        // Unique Key: Block|Panchayat
                        let key = (blockName + '|' + panchayatName).toLowerCase();
                        panchayatMap[key] = { panchayat: panchayatName, block: blockName };
                    }
                });

                // 3. Work Data (work.json) पार्स करें और फ़िल्टर करें
                const wHeaders = rawWork[0];
                const wData = rawWork.slice(1);

                let processedRows = [];
                let snoCounter = 1;

                wData.forEach(row => {
                    let workObj = {};
                    wHeaders.forEach((header, idx) => {
                        workObj[header] = row[idx] !== undefined ? String(row[idx]).trim() : '';
                    });

                    // Validation 1: Block और Panchayat होना चाहिए
                    let block = workObj['Block'] || '';
                    let panchayat = workObj['Panchayat'] || '';
                    if (!block || !panchayat) return;

                    // Validation 2: 10 अंकों से कम कोड वाले हटाएं
                    let workCode = workObj['Work Code'] || '';
                    let codePrefix = workCode.split('/')[0];
                    if (codePrefix.length < 10) return; // Skip

                    // Validation 3: Panchayat Map से मैच करें
                    let joinKey = (block + '|' + panchayat).toLowerCase();
                    let masterData = panchayatMap[joinKey];

                    if (masterData) {
                        processedRows.push({
                            'SNo.': snoCounter++,
                            'Panchayat': masterData.panchayat,
                            'Work Type': workObj['Work Type'] || '',
                            'Work Code': workObj['Work Code'] || '',
                            'Work Name': workObj['Work Name'] || '',
                            'Wages': workObj['Wages'] || '',
                            'Material': workObj['Material'] || '',
                            'Sanction': workObj['Sanction'] || '',
                            'Wages_Exp': workObj['Wages_Exp'] || '',
                            'Material_exp': workObj['Material_exp'] || '',
                            'Total': workObj['Total'] || '',
                            'Manday': workObj['Manday'] || ''
                        });
                    }
                });

                return processedRows;

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const errDiv = document.getElementById('error');
                errDiv.style.display = 'block';
                errDiv.innerText = "❌ त्रुटि: " + error.message;
                return [];
            }
        }

        // ---------------- RENDER FUNCTIONS ----------------
        let allData = [];

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const stats = document.getElementById('stats');
            const loading = document.getElementById('loading');
            
            loading.style.display = 'none';
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" style="text-align:center;">कोई डेटा नहीं मिला</td></tr>`;
                stats.innerText = `कुल कार्य: 0`;
                return;
            }

            data.forEach(row => {
                let tr = document.createElement('tr');
                Object.values(row).forEach(val => {
                    let td = document.createElement('td');
                    td.textContent = val;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            stats.innerText = `कुल कार्य: ${data.length}`;
        }

        function filterData(searchTerm) {
            if (!searchTerm) {
                renderTable(allData);
                return;
            }
            const lowerTerm = searchTerm.toLowerCase();
            const filtered = allData.filter(row => {
                return Object.values(row).some(val => 
                    String(val).toLowerCase().includes(lowerTerm)
                );
            });
            renderTable(filtered);
        }

        // ---------------- MAIN EXECUTION ----------------
        document.addEventListener('DOMContentLoaded', async () => {
            allData = await loadAndProcessData();
            
            if (allData.length > 0) {
                renderTable(allData);
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    filterData(e.target.value);
                });
            }
        });
    </script>
</body>
</html>
