<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पंचायत कार्य डैशबोर्ड</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .loading-msg {
            text-align: center;
            font-size: 18px;
            color: #555;
            margin-top: 50px;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .controls input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 250px;
            font-size: 14px;
        }
        .stats {
            font-size: 14px;
            color: #666;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) {
            background-color: #fcfcfc;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .error-msg {
            color: red;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>पंचायत कार्य डैशबोर्ड (मास्टर टेबल)</h1>

    <div class="container">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="खोजें (Work Name, Code, Panchayat...)">
            <div class="stats" id="stats">कुल कार्य: 0</div>
        </div>

        <div id="loading" class="loading-msg">⏳ JSON फाइलें लोड हो रही हैं, कृपया प्रतीक्षा करें...</div>
        <div id="error" class="error-msg" style="display:none;"></div>

        <table id="dashboardTable">
            <thead>
                <tr>
                    <th>SNo.</th>
                    <th>Panchayat</th>
                    <th>Work Type</th>
                    <th>Work Code</th>
                    <th>Work Name</th>
                    <th>Wages</th>
                    <th>Material</th>
                    <th>Sanction</th>
                    <th>Wages_Exp</th>
                    <th>Material_exp</th>
                    <th>Total</th>
                    <th>Manday</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be injected here -->
            </tbody>
        </table>
    </div>

    <script>
        // ------------------ 1. Data Loading & Parsing ------------------
        async function loadData() {
            try {
                // अब फ़ाइल का नाम 'data.json' है
                const [panchayatRes, workRes] = await Promise.all([
                    fetch('data.json'),
                    fetch('work.json')
                ]);

                if (!panchayatRes.ok || !workRes.ok) {
                    throw new Error("JSON फाइलें नहीं मिलीं। कृपया सुनिश्चित करें कि 'data.json' और 'work.json' इस HTML फाइल के साथ उसी फोल्डर में हैं।");
                }

                const rawPanchayat = await panchayatRes.json();
                const rawWork = await workRes.json();

                // ------------------ 2. Process Panchayat Data (Master) ------------------
                // Parser for data.json
                const pHeaders = rawPanchayat[1];
                const pData = rawPanchayat.slice(2); // Skip first 2 rows (header & empty)
                
                let panchayatMap = {};
                pData.forEach(row => {
                    // Use column names by index to avoid key-mismatch issues
                    // Columns: SNo.=0, Panchayats=1, Total=2, ... BLOCK=7, MANDAYS=11, Ongoing_Work=13
                    let panchayatName = String(row[1] || '').trim();
                    let blockName = String(row[7] || '').trim();
                    let mandays = row[11];
                    let ongoingWork = row[13];

                    if (panchayatName && blockName) {
                        // Create a unique key for joining: Block + Panchayat
                        let key = (blockName + '|' + panchayatName).toLowerCase();
                        panchayatMap[key] = {
                            panchayat: panchayatName,
                            block: blockName,
                            mandays: mandays,
                            ongoingWork: ongoingWork
                        };
                    }
                });

                // ------------------ 3. Process Work Data & Filter ------------------
                const wHeaders = rawWork[0];
                const wData = rawWork.slice(1); // Skip header row

                let processedRows = [];

                wData.forEach(row => {
                    // Build row object using index positions
                    let workObj = {};
                    wHeaders.forEach((header, idx) => {
                        workObj[header] = row[idx] !== undefined ? String(row[idx]).trim() : '';
                    });

                    // Validation 1: Check if Panchayat and Block exist
                    let block = workObj['Block'] || '';
                    let panchayat = workObj['Panchayat'] || '';
                    if (!block || !panchayat) return;

                    // Validation 2: Check Work Code (Remove < 10 digits)
                    let workCode = workObj['Work Code'] || '';
                    let codePrefix = workCode.split('/')[0];
                    if (codePrefix.length < 10) return; // Skip this work

                    // Validation 3: Match with Panchayat Master
                    let joinKey = (block + '|' + panchayat).toLowerCase();
                    let masterData = panchayatMap[joinKey];

                    if (masterData) {
                        // Push clean row for dashboard
                        processedRows.push({
                            'SNo.': '', // Will be filled later
                            'Panchayat': masterData.panchayat,
                            'Work Type': workObj['Work Type'] || '',
                            'Work Code': workObj['Work Code'] || '',
                            'Work Name': workObj['Work Name'] || '',
                            'Wages': workObj['Wages'] || '',
                            'Material': workObj['Material'] || '',
                            'Sanction': workObj['Sanction'] || '',
                            'Wages_Exp': workObj['Wages_Exp'] || '',
                            'Material_exp': workObj['Material_exp'] || '',
                            'Total': workObj['Total'] || '',
                            'Manday': workObj['Manday'] || ''
                        });
                    }
                });

                // Add Serial Numbers
                processedRows.forEach((row, index) => {
                    row['SNo.'] = index + 1;
                });

                return processedRows;

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const errDiv = document.getElementById('error');
                errDiv.style.display = 'block';
                errDiv.innerText = "❌ त्रुटि: " + error.message;
                return [];
            }
        }

        // ------------------ 4. Render Table & Search Functionality ------------------
        let allData = [];

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const stats = document.getElementById('stats');
            
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" style="text-align:center;">कोई डेटा नहीं मिला</td></tr>`;
                stats.innerText = `कुल कार्य: 0`;
                return;
            }

            data.forEach(row => {
                let tr = document.createElement('tr');
                Object.values(row).forEach(val => {
                    let td = document.createElement('td');
                    td.textContent = val;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            stats.innerText = `कुल कार्य: ${data.length}`;
        }

        function filterData(searchTerm) {
            if (!searchTerm) {
                renderTable(allData);
                return;
            }
            const lowerTerm = searchTerm.toLowerCase();
            const filtered = allData.filter(row => {
                return Object.values(row).some(val => 
                    String(val).toLowerCase().includes(lowerTerm)
                );
            });
            renderTable(filtered);
        }

        // ------------------ 5. Main Execution ------------------
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('loading').style.display = 'block';
            allData = await loadData();
            document.getElementById('loading').style.display = 'none';
            
            if (allData.length > 0) {
                renderTable(allData);
                
                // Attach Search Listener
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    filterData(e.target.value);
                });
            }
        });
    </script>
</body>
</html>
